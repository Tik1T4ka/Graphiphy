<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>TFJ F4 Clans</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=block" rel="stylesheet">
<style>
/* Meme disposition que le F4 "Classe" actuel, style TFJ noir / rouge / blanc.
   Images : deposer les fichiers dans images/ avec les noms indiques sur chaque emplacement. */
:root{--noir:#09090a;--bord:#2a2a2e;--gris:#8a8a92;--gris2:#3a3a40;--blanc:#f2f2f2;--rouge:#b01a1a;--rougeV:#d8262f}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;position:relative;font-family:Poppins,sans-serif;color:var(--blanc);
 background:radial-gradient(1100px 500px at 50% 100%,rgba(176,26,26,.35),transparent 70%),radial-gradient(700px 500px at 0% 0%,rgba(176,26,26,.25),transparent 70%),var(--noir)}
.t{font-family:'Bebas Neue',sans-serif;letter-spacing:1px}
/* emplacement d'image : cadre pointille tant que l'image n'est pas fournie */
.slot{position:absolute;display:flex;align-items:center;justify-content:center;border:1px dashed #55555c;color:#77777e;font-size:13px;text-align:center}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.slot img.ko{display:none}
.slot:has(img:not(.ko)){border:none;color:transparent}
/* onglets du haut */
.nav{position:absolute;top:34px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:38px}
.nav a{font-size:34px;color:var(--gris);padding-bottom:6px;border-bottom:2px solid transparent}
.nav a{display:flex;align-items:center;gap:10px}
.nav a.on{color:var(--blanc);border-color:var(--rougeV)}
.nav .logo{position:relative;width:190px;height:130px;margin:0 6px}
/* colonnes */
.col{position:absolute;top:175px;width:330px;height:820px}
.col:before{content:"";position:absolute;inset:0 20px 80px;border:1px solid color-mix(in srgb,var(--c1) 22%,#1d1d21);
 background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 6%,transparent),color-mix(in srgb,var(--c1) 20%,transparent) 45%,color-mix(in srgb,var(--c2) 38%,transparent) 85%,transparent)}
.col.on:before{border-color:color-mix(in srgb,var(--c1) 75%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--c1) 25%,transparent)}
.palier{position:absolute;left:0;right:0;display:flex;justify-content:center}
/* icone de la technique : reprise telle quelle du skill tree existant */
.palier .gem{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle,#2a2a2e,#151517 70%);border:1px solid #3a3a40}
.val{font-size:42px;line-height:1;display:flex;align-items:center;gap:6px}
.val i{font-style:normal;color:var(--rougeV);font-size:26px}
.sous{font-size:13px;color:var(--gris);margin-top:2px}
.illu{left:5px;top:430px;width:320px;height:310px}
.nom{position:absolute;left:0;right:0;top:742px;text-align:center}
.nom .t{position:relative;display:inline-flex;align-items:center;gap:12px;font-size:64px;line-height:1;padding:4px 26px 0}
/* trace de pinceau sous le titre */
.nom .t:before{content:"";position:absolute;inset:6px -6px 0;z-index:-1;background:linear-gradient(90deg,transparent,#3a0a0c 18%,#5a0f12 50%,#3a0a0c 82%,transparent);clip-path:polygon(0 30%,6% 8%,22% 16%,40% 0,63% 12%,80% 2%,96% 14%,100% 60%,92% 92%,70% 82%,48% 100%,26% 86%,8% 96%)}
.nom svg{width:46px;height:46px}
/* bas */
.mascotte{left:0;top:640px;width:340px;height:330px}
.gemmes{position:absolute;left:40px;top:975px;display:flex;align-items:flex-end;gap:10px}
.gemmes b{font-family:'Bebas Neue';font-size:96px;line-height:.8;font-weight:400}
.gemmes span{font-size:30px;line-height:1}
</style>
</head>
<body>
<nav class="nav t">
  <a>NATURES</a><a>STYLES</a>
  <div class="slot logo">logo.png<img src="images/logo.png" onerror="this.className='ko'"></div>
  <a>CLASSES</a><a class="on">CLANS</a><a>KEKKEI GENKAI</a>
</nav>


<!-- une seule colonne : le jeu n'affiche que l'arbre du joueur (fnCheck dans sh_nrp_battle.lua), sans illustration -->
<div class="col on" style="left:892px;--c1:#d8262f;--c2:#6a0e12">
  <div class="palier" style="top:45px"><span class="gem"></span></div>
  <div class="palier" style="top:150px"><span class="gem"></span></div>
  <div class="palier" style="top:255px"><span class="gem"></span></div>
  <div class="palier" style="top:360px"><span class="gem"></span></div>
  <div class="nom"><div class="t">CLAN UCHIHA</div></div>
</div>

<div class="slot mascotte">mascotte.png<img src="images/mascotte.png" onerror="this.className='ko'"></div>
<div class="gemmes t"><b>34</b><span>POINTS DE<br>COMPÉTENCE</span></div>
</body>
</html>
